[project]
name = "g1-poser"
version = "0.1.0"
description = "MuJoCo G1 poser and verified flat-ground crawl preview with a Halloween cemetery scene"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loop-rate-limiters>=1.2.0",
    "matplotlib>=3.10.6",
    "mink>=0.0.12",
    "mujoco>=3.3.5",
]

[project.optional-dependencies]
crawl = [
    "mujoco==3.8.0",
    "numpy==2.4.4",
    "torch==2.7.0",
]
