algo:
  num_envs: 32
  num_steps_per_env: 24
  max_iterations: 10
  save_interval: 10
  seed: 1
  empirical_normalization: false
  obs_groups:
    actor: [obs]
    critic: [obs]
  policy:
    init_noise_std: 0.3
    actor_hidden_dims: [256, 128, 128]
    critic_hidden_dims: [256, 128, 128]
    activation: elu
  algorithm:
    clip_param: 0.2
    entropy_coef: 0.005
    learning_rate: 0.0003
    num_learning_epochs: 5
    num_mini_batches: 4
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
    disable_finite_checks: false
    finite_check_interval: 1
    metrics_interval: 1
    adaptive_lr_update_interval: 1
    adaptive_kl_beta: 0.0
    adaptive_lr_growth: 1.5
    adaptive_lr_decay: 1.5
training:
  task_name: G1IKTracking23
  sim_backend: mujoco
  no_play: true
  logger: tensorboard
  log_interval: 10
env:
  seed: ${algo.seed}
  reference_motion: false
  force_source: analytic_pd
  speed_min: 0.0
  speed_max: 0.0
  max_episode_seconds: 20.0
  control_config:
    action_scale: 0.5
reward:
  scales:
    ik_v1_nonnegative: 1.0
